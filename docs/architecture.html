<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Architecture &mdash; Social Content Intelligence: Claim Classification</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
  #wrap { padding: 90px 40px 40px 40px; width: 1180px; }
  #diagram { width: 100%; }
</style>
</head>
<body>
<div id="wrap"><div id="diagram"></div></div>

<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

mermaid.initialize({
  startOnLoad: false,
  theme: "base",
  themeVariables: {
    fontSize: "16px",
    fontFamily: "Segoe UI, Helvetica, Arial, sans-serif",
    primaryColor: "#e8f6f8",
    primaryBorderColor: "#20d5ec",
    primaryTextColor: "#111418",
    secondaryColor: "#f3f4f6",
    tertiaryColor: "#ffffff",
    lineColor: "#5b6470",
    clusterBkg: "#fafbfc",
    clusterBorder: "#c9cfd6"
  },
  flowchart: { curve: "basis", padding: 14, nodeSpacing: 40, rankSpacing: 55, htmlLabels: true }
});

const source = await (await fetch("./architecture.mmd")).text();
const { svg } = await mermaid.render("arch", source.replace(/^%%[^\n]*\n/gm, ""));
document.getElementById("diagram").innerHTML = svg;
const el = document.querySelector("#diagram svg");
const vb = el.getAttribute("viewBox").split(/\s+/).map(Number);
const naturalWidth = Math.min(Math.round(vb[2]), 2400);
const wrap = document.getElementById("wrap");
wrap.style.width = naturalWidth + "px";
el.removeAttribute("height");
el.setAttribute("width", String(naturalWidth));
el.style.maxWidth = "none";
el.style.height = "auto";
document.title = "ready";
</script>
</body>
</html>
